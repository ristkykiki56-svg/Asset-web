<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Twin Shooter viewport smoke harness</title>
<style>
body{margin:0;padding:0;font:14px system-ui,sans-serif;background:#fff}
#result{padding:8px;white-space:pre-wrap}
iframe{display:block;border:0;height:920px;width:320px}
</style>
</head>
<body>
<output id="result" data-status="pending">RUNNING</output>
<iframe id="page" title="Twin Shooter responsive test" src="/"></iframe>
<script>
(() => {
  const frame = document.getElementById('page');
  const result = document.getElementById('result');
  const widths = [320, 360, 375, 390, 680, 768, 900, 1024, 1280, 1440];
  const errors = [];
  window.addEventListener('load', async () => {
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.querySelector('.hero-section')) throw new Error('Homepage was not loaded');
      const imgs = [...doc.querySelectorAll('.duo-stage img')];
      if (imgs.length !== 2 || imgs.some(img => img.naturalWidth < 1)) errors.push('athlete photos missing');
      for (const width of widths) {
        frame.style.width = width + 'px';
        const root = doc.documentElement;
        const actual = Math.max(root.scrollWidth, doc.body.scrollWidth);
        if (actual > width + 1) errors.push(width + 'px horizontal overflow (' + actual + 'px)');
        for (const selector of ['.hero-section h1', '.duo-stage', '.highlight-band', '#p70-showcase', '#achievements']) {
          const el = doc.querySelector(selector);
          if (!el || el.getBoundingClientRect().width <= 0) errors.push(width + 'px missing layout ' + selector);
        }
      }
      const all = doc.querySelectorAll('#grid .sb-row:not([hidden])').length;
      if (all !== 25) errors.push('expected 25 results, got ' + all);
      const clarisa = doc.querySelector('[data-filter="clarisa"]');
      clarisa.click();
      const filtered = doc.querySelectorAll('#grid .sb-row:not([hidden])').length;
      if (!filtered || filtered >= 25) errors.push('athlete filter did not change results');
      if (clarisa.getAttribute('aria-pressed') !== 'true') errors.push('aria-pressed not updated');
      if (!doc.querySelector('#results-status').textContent.includes(String(filtered))) errors.push('live status not updated');
      doc.querySelector('[data-filter="all"]').click();
      if (doc.querySelectorAll('#grid .sb-row:not([hidden])').length !== 25) errors.push('reset filter failed');
      // Scroll-reveal guard: hidden-until-JS content must actually become
      // visible once its reveal class is added (a specificity slip in the
      // CSS can leave it at opacity 0 forever). Disable transitions AND
      // animations inside the frame first, so the check reads the final
      // cascade state instead of racing them under virtual time. That
      // alone only helps transitions that start after the override: the
      // hero transition starts at page load, before this style lands, and
      // stays frozen mid-flight because virtual time does not advance it.
      // So restart it: remove and re-add .motion-ready (with a forced
      // reflow between) so a fresh transition runs with 0s duration.
      // This still guards the real bug: if the visible rule lost the
      // specificity fight, the fresh transition would end at opacity 0.
      const noAnim = doc.createElement('style');
      noAnim.textContent = '*{transition-duration:0s !important;transition-delay:0s !important;animation-duration:0s !important;animation-delay:0s !important}';
      doc.head.appendChild(noAnim);
      const rootEl = doc.documentElement;
      rootEl.classList.remove('motion-ready');
      void rootEl.offsetHeight;
      rootEl.classList.add('motion-ready');
      const revealEl = doc.querySelector('.featured-item[data-reveal]');
      revealEl.scrollIntoView({block: 'center'});
      const heroTitle = doc.querySelector('.hero-title');
      heroTitle.scrollIntoView({block: 'center'});
      await new Promise(r => setTimeout(r, 2000));
      const revealOpacity = doc.defaultView.getComputedStyle(revealEl).opacity;
      if (revealOpacity !== '1') errors.push('data-reveal block stayed invisible (opacity ' + revealOpacity + ')');
      const heroOpacity = doc.defaultView.getComputedStyle(heroTitle).opacity;
      if (heroOpacity !== '1') errors.push('hero title stayed invisible (opacity ' + heroOpacity + ')');
      result.dataset.status = errors.length ? 'fail' : 'pass';
      result.textContent = errors.length ? errors.join(' | ') : 'PASS: responsive widths, images, 25 results, filter & aria feedback, reveal opacity';
    } catch(err) {
      result.dataset.status='fail';
      result.textContent='EXCEPTION: ' + String(err.message || err);
    }
  },{once:true});
})();
</script>
</body>
</html>
