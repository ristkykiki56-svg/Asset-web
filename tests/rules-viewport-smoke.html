<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
  <p id="status" data-status="pending">Loading Rules browser QA…</p>
  <iframe id="site" title="Rules fixture" src="/rules.html" style="width:390px;height:960px;border:0"></iframe>
  <script>
  (async()=>{
    const result=document.getElementById('status');
    const frame=document.getElementById('site');
    const waitFor=(fn,limit=18000)=>new Promise((resolve,reject)=>{
      const started=Date.now();
      const poll=()=>{try{if(fn())return resolve();}catch(e){return reject(e)}
        if(Date.now()-started>limit)return reject(new Error('Timeout: '+(frame.contentDocument?.documentElement.dataset.pdfRendered||'no state')+'; ready='+frame.contentDocument?.readyState+'; load='+frame.contentDocument?.getElementById('pdfLoading')?.textContent+'; error='+frame.contentDocument?.getElementById('pdfError')?.hidden+'; canvas='+frame.contentDocument?.getElementById('pdfCanvas')?.width+'; scripts='+frame.contentDocument?.querySelectorAll('script')?.length));
        setTimeout(poll,90);
      };poll();
    });
    try {
      await new Promise((resolve,reject)=>{
        frame.addEventListener('load',resolve,{once:true});
        frame.addEventListener('error',()=>reject(Error('iframe load failed')),{once:true});
      });
      const doc=frame.contentDocument,win=frame.contentWindow;
      await waitFor(()=>doc.documentElement.dataset.pdfRendered==='rules:1',30000);
      const canvas=doc.getElementById('pdfCanvas');
      if(canvas.width<100||canvas.height<100)throw Error('Rules initial PDF rendered blank');
      if(doc.getElementById('pageTotal').textContent.trim()!=='110')throw Error('Rules count not 110');
      if(!doc.getElementById('openPdf').href.includes('imssu-sporting-rules-2025-bilingual.pdf'))throw Error('Wrong PDF link');
      for(const width of [320,360,390,768,1100]){
        frame.style.width=width+'px';
        await new Promise(r=>setTimeout(r,350));
        const root=doc.documentElement;
        if(root.scrollWidth>root.clientWidth+3)throw Error('Rules horizontal overflow at '+width+': '+root.scrollWidth+' / '+root.clientWidth);
      }
      frame.style.width='390px';
      await new Promise(r=>setTimeout(r,350));
      doc.getElementById('pageNext').click();
      await waitFor(()=>doc.documentElement.dataset.pdfRendered==='rules:2');
      if(doc.getElementById('pageNumber').value!=='2')throw Error('Next page control failed');
      doc.getElementById('pagePrev').click();
      await waitFor(()=>doc.documentElement.dataset.pdfRendered==='rules:1');
      const baseline=parseInt(canvas.style.width,10);
      doc.getElementById('zoomIn').click();
      await waitFor(()=>parseInt(canvas.style.width,10)>baseline+35);
      if(doc.getElementById('zoomLabel').textContent.trim()!=='125%')throw Error('Zoom label failed');
      doc.getElementById('zoomReset').click();
      await waitFor(()=>doc.getElementById('zoomLabel').textContent.trim()==='Lebar');
      doc.getElementById('docChoiceMinutes').click();
      await waitFor(()=>doc.documentElement.dataset.pdfRendered==='minutes:1',22000);
      if(doc.getElementById('pageTotal').textContent.trim()!=='45')throw Error('Minutes count not 45');
      if(!doc.getElementById('openPdf').href.includes('imssu-oga-minutes-2026.pdf'))throw Error('Minutes direct PDF broken');
      if(!win.location.search.includes('doc=minutes'))throw Error('Document deep link not updated');
      const input=doc.getElementById('pdfSearchInput');
      input.value='General Assembly';
      doc.getElementById('pdfSearchForm').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
      await waitFor(()=>/halaman ditemukan|Tidak ada halaman|belum berhasil/.test(doc.getElementById('searchStatus').textContent),45000);
      if(!/halaman ditemukan/.test(doc.getElementById('searchStatus').textContent))throw Error('PDF text search did not find an expected phrase');
      result.dataset.status='pass';
      result.textContent='Rules PDF.js pass: 110/45 pages, original links, nav, fit/zoom, search, 320-1100 responsive';
    }catch(e){
      result.dataset.status='fail';
      result.textContent='RULES ERROR: '+String(e.message||e);
    }
  })();
  </script>
</body>
</html>
