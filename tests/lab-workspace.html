<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>Mobile lab studio regression</title>
<style>body{font:14px system-ui}output{display:block;white-space:pre-wrap}iframe{height:667px;border:0}</style>
<output id="result" data-status="pending">RUNNING</output>
<script type="module">
const result=document.querySelector('#result'),errors=[];let checks=0;
const assert=(yes,message)=>{checks++;if(!yes)errors.push(message)};
const settle=f=>new Promise(r=>f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(r)));
try {
for(const width of [320,375,390]){
 const f=document.createElement('iframe');f.title='Lab Studio fixture';f.style.width=width+'px';f.src='/lab.html';
 const ready=new Promise(r=>f.onload=r);document.body.append(f);await ready;await f.contentDocument.fonts.ready;await settle(f);
 const d=f.contentDocument,w=f.contentWindow;
 // Old mobile workspace is gone; the studio tab bar + bottom nav replace it.
 assert(!d.documentElement.classList.contains('lw-active'),width+': old workspace must be gone');
 assert(!d.querySelector('.lw-workbench,#labMobileModuleSelect,#labMobilePosePicker'),width+': old workspace markup must be gone');
 const nav=[...d.querySelectorAll('.mobile-nav-btn')];
 assert(nav.length===6,width+': six mobile nav buttons');
 const active=[...d.querySelectorAll('.lab-panel.is-active')];
 assert(active.length===1&&active[0].id==='sec-biomech',width+': posture panel active first');
 assert(d.documentElement.scrollWidth<=width+1,width+': no page overflow');
 const ids=[...d.querySelectorAll('[id]')].map(e=>e.id);assert(new Set(ids).size===ids.length,width+': unique DOM ids');
 assert(d.querySelectorAll('#ocularLensCanvas').length===1,width+': one lens canvas');
 nav.find(b=>b.dataset.studioTab==='sec-optics').click();await settle(f);
 assert(d.querySelector('#sec-optics').classList.contains('is-active'),width+': optics tab activates');
 assert(!d.querySelector('#ocularLensCanvas').closest('[hidden]'),width+': lens visible');
 nav.find(b=>b.dataset.studioTab==='sec-biomech').click();await settle(f);
 for(const pin of d.querySelectorAll('#biomechPinsOverlay .callout-node:not([hidden])')){const r=pin.getBoundingClientRect();assert(r.left>=0&&r.right<=width+1,width+': posture pin within screen');}
 nav.find(b=>b.dataset.studioTab==='sec-hardware').click();await settle(f);
 assert(d.querySelectorAll('#hardwareBlueprintSvg .hw-marker').length===10,width+': ten hardware markers');
 nav.find(b=>b.dataset.studioTab==='sec-match').click();await settle(f);
 assert(d.querySelector('#sec-match').classList.contains('is-active'),width+': match tab activates');
 nav.find(b=>b.dataset.studioTab==='sec-biomech').click();await settle(f);
 assert(d.querySelector('#sec-biomech').classList.contains('is-active'),width+': back to posture');
 f.remove();
}
} catch(error){errors.push('Fixture exception: '+error.message);}
result.dataset.status=errors.length?'fail':'pass';result.textContent=JSON.stringify({checks,errors},null,2);
</script></html>
