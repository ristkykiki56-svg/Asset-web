<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><title>Laboratory browser regression</title></head>
<body>
<output id="result" data-status="pending">CHECKING</output>
<iframe id="lab" src="/lab.html" title="Lab QA" style="width:320px;height:900px;border:0;display:block"></iframe>
<script>
const frame=document.getElementById('lab');
const output=document.getElementById('result');
frame.addEventListener('load',async ()=>{
 const problems=[];
 try {
 const w=frame.contentWindow;
 const doc=frame.contentDocument;
 if(!doc.querySelector('.lab-notice')) problems.push('illustrative warning missing');
 if(!doc.querySelector('a[href="/"]')) problems.push('home backlink missing');
 if(doc.querySelectorAll('input[type=range]').length!==9) problems.push('slider count');
 if(doc.querySelectorAll('input[type=range]:not([aria-label])').length) problems.push('unlabelled sliders');
 if(doc.querySelectorAll('.steel-target-btn').length!==20) problems.push('target count');
 if(doc.querySelectorAll('.steel-target-btn:not([aria-label])').length) problems.push('unlabelled targets');
 if(!Array.from(doc.styleSheets).some(sheet => sheet.href && sheet.href.includes('lab-utilities.css'))) problems.push('static CSS missing');
 for(const width of [320,360,375,390,768,1024,1280,1440]){
   frame.style.width=width+'px';
   const contentW=Math.max(doc.documentElement.scrollWidth,doc.body.scrollWidth);
   if(contentW>width+2){
     const offenders=Array.from(doc.querySelectorAll('body *')).map(el=>({name:el.tagName.toLowerCase()+'.'+String(el.className?.baseVal??el.className).slice(0,45),right:Math.round(el.getBoundingClientRect().right),sw:el.scrollWidth,cw:el.clientWidth})).filter(el=>el.right>width+3 && el.sw>0).sort((a,b)=>b.right-a.right).slice(0,6);
     problems.push('overflow '+width+': '+contentW+' '+JSON.stringify(offenders));
   }
 }
 frame.style.width='390px';
 if(w.getComputedStyle(doc.querySelector('.lab-mobile-stepper')).position!=='fixed')problems.push('mobile lesson dock is not persistent');
 const anatomy=doc.getElementById('labCalloutPicker');
 if(!anatomy || anatomy.options.length!==10)problems.push('anatomy selector missing ten items');
 else {
   anatomy.value='head';
   anatomy.dispatchEvent(new Event('change',{bubbles:true}));
   if(!doc.getElementById('dossierTitle').textContent.includes('Kepala'))problems.push('anatomy description not changed');
   if(!doc.getElementById('stagePoseTitle').textContent.includes('DEPAN'))problems.push('anatomy viewpoint not synchronized');
 }
 const hardware=doc.getElementById('labHardwarePicker');
 if(!hardware || hardware.options.length!==10)problems.push('equipment picker missing ten components');
 else {
   hardware.value='ocular';hardware.dispatchEvent(new Event('change',{bubbles:true}));
   if(!doc.getElementById('hwSpecTitle').textContent.includes('Okuler'))problems.push('equipment explanation not updated');
   if(!doc.querySelector('[data-hw-key="ocular"].is-highlighted'))problems.push('equipment part not highlighted');
 const marker=doc.querySelector('#hardwareBlueprintSvg .hw-marker[data-hw-key="ocular"]');
 if(marker?.getAttribute('aria-pressed')!=='true')problems.push('selected SVG hardware marker aria-pressed missing');
 if(doc.querySelectorAll('#hardwareBlueprintSvg .hw-region[tabindex]').length)problems.push('duplicate keyboard stops for hardware regions');
 const stockMarker=doc.querySelector('#hardwareBlueprintSvg .hw-marker[data-hw-key="stock"]');
 stockMarker?.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 if(stockMarker?.getAttribute('aria-pressed')!=='true'||marker?.getAttribute('aria-pressed')!=='false')problems.push('SVG hardware keyboard selection not synchronized');
 hardware.value='ocular';hardware.dispatchEvent(new Event('change',{bubbles:true}));

 if(doc.querySelectorAll('#hardwareBlueprintSvg .hw-marker').length!==10) problems.push('equipment numbered hotspots not 10');
 if(doc.querySelectorAll('#hardwareBlueprintSvg .hw-region').length!==5) problems.push('equipment interactive exterior groups not 5');
 if(doc.getElementById('blueprintActiveLabel').textContent!=='DIPILIH: Lensa okuler')problems.push('equipment selected header not synchronized');
 w.switchRifleRig('clarisa');
 if(doc.getElementById('rigMainChassis').getAttribute('fill')!=='#0055B8')problems.push('equipment blue illustration variant failed');
 if(doc.getElementById('rigSwitch-clarisa').getAttribute('aria-pressed')!=='true')problems.push('equipment variant aria state failed');
 w.switchRifleRig('aurellia');
 if(doc.getElementById('rigRearBlock').getAttribute('fill')!=='#D11F26')problems.push('equipment red illustration variant failed');
 w.adjustRifleBalancePoint(470);
 if(!doc.getElementById('svgCobFulcrum').getAttribute('transform').includes('470'))problems.push('equipment balance diagram wiring failed');

 }

 const picker=doc.getElementById('labMobileModuleSelect');
 if(!picker || picker.options.length!==5) problems.push('mobile picker missing options');
 if(!doc.documentElement.classList.contains('lab-mobile-focused'))problems.push('mobile focus mode missing');
 if(!doc.getElementById('sec-biomech').classList.contains('is-active'))problems.push('initial module not active');
 if(doc.querySelector('.lab-notice-wrap').open)problems.push('notice should begin collapsed on mobile');


 // Exercise every anatomy point across narrow and wide viewports, including
 // genuine hit-testing of the button center and preservation of keyboard focus.
 const anatomyPose={spine:'back',head:'front',rightShoulder:'front',leftArm:'front',
   leftWrist:'sideLeft',rightHand:'sideLeft',elbowHip:'front',
   pelvis:'sideRight',leftLeg:'front',rightLeg:'front'};
 const allAnatomy=Array.from(anatomy?.options||[]);
 if(allAnatomy.length!==10)problems.push('anatomy must expose exactly ten options');
 else for(const width of [390,1024]) {
   frame.style.width=width+'px';
   for(const option of allAnatomy) {
     w.selectBiomechCallout(option.value);
     const pin=doc.querySelector('#biomechPinsOverlay [data-biomech-id="'+option.value+'"]');
     if(!pin||pin.hidden) {problems.push('missing visible anatomy pin '+width+' '+option.value);continue;}
     pin.scrollIntoView({block:'center'});
     w.positionBiomechPins();
     const rect=pin.getBoundingClientRect();
     const hit=doc.elementFromPoint(rect.left+rect.width/2,rect.top+rect.height/2);
     if(hit!==pin && !pin.contains(hit))problems.push('anatomy pin obscured '+width+' '+option.value);
     const previous=pin;
     pin.focus();
     pin.click();
     if(doc.querySelector('#biomechPinsOverlay [data-biomech-id="'+option.value+'"]')!==previous)
       problems.push('anatomy button remounted on click '+width+' '+option.value);
     if(doc.activeElement!==pin)problems.push('anatomy keyboard focus lost '+width+' '+option.value);
     if(pin.getAttribute('aria-pressed')!=='true')problems.push('anatomy pressed state '+width+' '+option.value);
     if(anatomy.value!==option.value||doc.getElementById('labMobilePosePicker').value!==anatomyPose[option.value])
       problems.push('anatomy pose or picker mismatch '+width+' '+option.value);
     if(!doc.getElementById('dossierCode').textContent.includes('#'+option.textContent.slice(0,2)))
       problems.push('anatomy dossier does not match pin '+width+' '+option.value);
     const viewSvg=doc.getElementById('biomechDraftSvg');
     const p=viewSvg.createSVGPoint();p.x=Number(pin.dataset.svgX);p.y=Number(pin.dataset.svgY);
     const mapped=p.matrixTransform(viewSvg.getScreenCTM());
     const box=pin.getBoundingClientRect();
     if(Math.hypot(mapped.x-(box.left+box.width/2),mapped.y-(box.top+box.height/2))>3)
       problems.push('anatomy position misaligned '+width+' '+option.value);
   }
   w.switchPose('front');
   const visible=doc.querySelectorAll('#biomechPinsOverlay .callout-node:not([hidden])');
   if(visible.length!==6)problems.push('front anatomy view should expose six pins '+width);
   if(width===390){
     const computed=w.getComputedStyle(visible[0]);
     if(computed.display==='none')problems.push('mobile hides non-selected anatomy pins');
   }
 }
 frame.style.width='390px';
 w.selectBiomechCallout('head');

 const svg=doc.getElementById('biomechDraftSvg');
 const selected=doc.querySelector('#biomechPinsOverlay .callout-node[aria-pressed="true"]');
 w.positionBiomechPins();
 if(!selected || !svg?.getScreenCTM())problems.push('posture selected SVG callout missing');
 else {
   const p=svg.createSVGPoint();
   p.x=Number(selected.dataset.svgX);p.y=Number(selected.dataset.svgY);
   const expected=p.matrixTransform(svg.getScreenCTM());
   const rect=selected.getBoundingClientRect();
   if(Math.hypot((rect.left+rect.width/2)-expected.x,(rect.top+rect.height/2)-expected.y)>3)
     problems.push('posture hotspot position not aligned with SVG');
 }
 const elbowControl=doc.getElementById('hipLockSlider');
 const beforeArm=doc.querySelector('#svgAthleteLayer .biomech-editorial-figure')?.innerHTML;
 elbowControl.value='20';elbowControl.dispatchEvent(new Event('input',{bubbles:true}));
 const afterArm=doc.querySelector('#svgAthleteLayer .biomech-editorial-figure')?.innerHTML;
 if(beforeArm===afterArm)problems.push('elbow control did not change illustrated figure');
 w.resetPostureParameters();
 if(doc.getElementById('hipLockSlider').value!=='100')problems.push('posture reset did not restore elbow value');

 if(picker){
   picker.value='sec-optics';
   picker.dispatchEvent(new Event('change',{bubbles:true}));
   if(!doc.getElementById('sec-optics').classList.contains('is-active'))problems.push('picker did not select optics');
   if(!doc.getElementById('labModuleProgress').textContent.includes('3 dari 5'))problems.push('module progress mismatch');
   doc.getElementById('labNextModule').click();
   if(!doc.getElementById('sec-imssu').classList.contains('is-active'))problems.push('next lesson failed');
 }
 w.switchPose('sideRight');
 if(!doc.getElementById('dossierRef').textContent.includes('SKEMA EDUKATIF'))problems.push('pose/dossier provenance label missing');
 w.switchPose('front');
 if(!doc.getElementById('stagePoseTitle').textContent.includes('DEPAN'))problems.push('pose not changed');
 if(doc.getElementById('labMobilePosePicker').value!=='front')problems.push('compact pose selector out of sync');
 const compactPose=doc.getElementById('labMobilePosePicker');
 compactPose.value='sideLeft';
 compactPose.dispatchEvent(new Event('change',{bubbles:true}));
 if(!doc.getElementById('stagePoseTitle').textContent.includes('KIRI'))problems.push('compact pose selection did not update drawing');
 if(!doc.querySelector('#svgAthleteLayer .biomech-editorial-figure')&&!doc.querySelector('#svgAthleteLayer image[href*="/assets/posture/"]'))problems.push('posture figure absent');
 if(!doc.getElementById('biomechRedKit'))problems.push('posture illustration gradients absent');
 if(!doc.getElementById('triggerVectorDiagram')||!doc.getElementById('triggerMechanismDiagram'))problems.push('trigger illustration absent');
 if(!doc.getElementById('opticalAlignmentIllustration'))problems.push('optics side study absent');
 if(!doc.querySelector('.silhouette-study'))problems.push('silhouette vector studies absent');
 const first=doc.getElementById('target-chicken-0');
 first.click();
 if(first.getAttribute('aria-pressed')!=='true')problems.push('target press ARIA');
 if(!doc.getElementById('rackHitScore').textContent.includes('01'))problems.push('target count feedback');
 if(doc.getElementById('rackGroupScore').textContent.trim()!=='1 / 5')problems.push('active group count mismatch');
 w.selectRangeAnimal('ram');
 if(doc.getElementById('rackGroupScore').textContent.trim()!=='0 / 5')problems.push('new group count should be zero');
 w.selectRangeAnimal('chicken');
 w.resetSilhouetteRack();
 if(doc.getElementById('rackGroupScore').textContent.trim()!=='0 / 5')problems.push('reset group count not zero');
 if(!doc.querySelector('[data-rack-animal="chicken"]').classList.contains('is-current'))problems.push('active target group mismatch');

 const triggerSvg=doc.querySelector('#triggerVectorDiagram [data-trigger-vector="C"]');
 triggerSvg?.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 if(triggerSvg?.getAttribute('aria-pressed')!=='true'||doc.getElementById('btnVec-C').getAttribute('aria-pressed')!=='true')problems.push('SVG trigger vector keyboard state not synchronized');
 w.selectFingerVector('A');
 if(doc.getElementById('btnVec-A').getAttribute('aria-pressed')!=='true'||doc.getElementById('btnVec-B').getAttribute('aria-pressed')!=='false')problems.push('vector selection status incorrect');
 w.selectFingerVector('B');
 const eye=doc.getElementById('optEyeDist');
 eye.value='120';eye.dispatchEvent(new Event('input',{bubbles:true}));
 if(!doc.getElementById('opticsLockBadge').textContent.includes('BAYANGAN'))problems.push('optical explanation not updated');
 w.calibratePerfectOptics();
 if(!doc.getElementById('opticsLockBadge').textContent.includes('LINGKARAN'))problems.push('optical reset did not restore example');
 w.location.hash='#sec-trigger';
 w.dispatchEvent(new HashChangeEvent('hashchange'));
 if(!doc.getElementById('sec-trigger').classList.contains('is-active'))problems.push('direct #sec-trigger navigation broken');
 doc.getElementById('tactileTriggerBtn').dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));
 if(doc.getElementById('tactileTriggerBtn').getAttribute('aria-pressed')!=='true') problems.push('keyboard trigger down');
 doc.getElementById('tactileTriggerBtn').dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true}));
 if(doc.getElementById('tactileTriggerBtn').getAttribute('aria-pressed')!=='false') problems.push('keyboard trigger up');

 // Check actual image readiness when present. Fallback success alone is not image QA.
 const spriteFiles=['blue-front','blue-side','blue-back','red-front','red-side','red-back'];
 const spriteFound=await Promise.all(spriteFiles.map(name=>new Promise(resolve=>{
   const image=new w.Image();image.onload=()=>resolve(image.naturalWidth>=120);
   image.onerror=()=>resolve(false);image.src='/assets/posture/'+name+'.webp';
 })));
 const countPresent=spriteFound.filter(Boolean).length;
 if(countPresent!==0 && countPresent!==6)problems.push('partial blue/red sprite asset set');
 const artStatus=doc.getElementById('postureArtStatus');
 const artMode=doc.getElementById('postureArtMode');
 if(!artStatus||!artMode||!w.tsPosturePoseArt)problems.push('posture sprite adapter controls unavailable');
 else{
   for(let tries=0;tries<40&&artStatus.textContent.includes('Memeriksa');tries++)
     await new Promise(resolve=>setTimeout(resolve,50));
   if(countPresent===6){
     if(artMode.disabled||!w.tsPosturePoseArt.isActive())problems.push('complete sprite set not activated');
     const red=doc.querySelector('[data-pose-color="red"]');
     red?.click();
     if(red?.getAttribute('aria-pressed')!=='true')problems.push('red sprite selection ARIA missing');
     w.switchPose('front');
     if(!doc.querySelector('#svgAthleteLayer image[href$="red-front.webp"]'))problems.push('red front view not displayed');
     w.switchPose('sideRight');
     if(!doc.querySelector('#svgAthleteLayer image[href$="red-side.webp"]'))problems.push('red side image missing');
     if(!doc.querySelector('#svgAthleteLayer g[transform="translate(460 0) scale(-1 1)"]'))problems.push('right-side mirror absent');
     w.switchPose('back');
     if(!doc.querySelector('#svgAthleteLayer image[href$="red-back.webp"]'))problems.push('red back view missing');
     doc.querySelector('[data-pose-color="blue"]')?.click();
     if(!doc.querySelector('#svgAthleteLayer image[href$="blue-back.webp"]'))problems.push('blue sprite variant missing');
     artMode.checked=false;artMode.dispatchEvent(new Event('change',{bubbles:true}));
     if(!doc.querySelector('#svgAthleteLayer .biomech-editorial-figure'))problems.push('manual SVG fallback unavailable');
     artMode.checked=true;artMode.dispatchEvent(new Event('change',{bubbles:true}));
     if(!w.tsPosturePoseArt.isActive())problems.push('sprite mode cannot be re-enabled');
   }else{
     if(!artMode.disabled||w.tsPosturePoseArt.isActive())problems.push('incomplete asset set incorrectly enabled');
     if(!doc.querySelector('#svgAthleteLayer .biomech-editorial-figure'))problems.push('missing image must preserve SVG fallback');
   }
 }
 }catch(e){problems.push('exception: '+String(e.message||e));}
 output.dataset.status=problems.length?'fail':'pass';
 output.textContent=problems.length?problems.join('; '):'PASS: responsive UI, poster interactions, static sprite readiness and SVG fallback';
},{once:true});
</script>
</body></html>
