<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four Lab Illustrations — visual QA</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#F3F1EA}iframe{display:block;width:100%;height:100%;border:0}</style>
</head><body>
<iframe id="lab" src="/lab.html" title="Isolated Shooting Lab illustration QA"></iframe>
<script>
const names={posture:'sec-biomech',trigger:'sec-trigger',optics:'sec-optics',silhouette:'sec-imssu'};
const lesson=new URL(location.href).searchParams.get('lesson')||'posture';
const id=names[lesson]||names.posture;
const frame=document.getElementById('lab');
frame.addEventListener('load',()=>{
 try {
  const doc=frame.contentDocument,win=frame.contentWindow;
  const main=doc.getElementById('main-content'),section=doc.getElementById(id);
  if(!main||!section)throw Error('missing module');
  for(const selector of ['.lab-header','.lab-local-nav','body > section.tech-border-b','.lab-notice-wrap','.lab-sources-wrap','.lab-mobile-stepper','footer']){
   doc.querySelectorAll(selector).forEach(node=>node.style.setProperty('display','none','important'));
  }
  main.querySelectorAll('section[id^="sec-"]').forEach(node=>{if(node!==section)node.style.setProperty('display','none','important')});
  section.style.setProperty('display','block','important');
  section.style.margin='0';
  main.classList.remove('space-y-16');main.style.padding='14px 14px 20px';main.style.margin='0 auto';
  const pose=new URL(location.href).searchParams.get('pose');
  if(id==='sec-biomech' && ['back','front','sideLeft','sideRight'].includes(pose))win.switchPose(pose);
  if(id==='sec-optics'){
   const params=new URL(location.href).searchParams;
   if(params.has('dist')||params.has('height')){
    if(params.has('dist'))doc.getElementById('optEyeDist').value=params.get('dist');
    if(params.has('height'))doc.getElementById('optCheekHeight').value=params.get('height');
    win.updateOpticalSim();
   }
   if(params.get('detail')==='1')doc.getElementById('opticsDetailToggle').click();
  }
  win.scrollTo(0,0);
  if(id==='sec-optics'){
   // Decode every registered raster layer before screenshots. In headless
   // Chromium, a large transparent WebP can otherwise briefly paint alone
   // during the first programmatic mobile zoom/scroll frame.
   const images=['opticStaticArt','opticHeadArt','opticForegroundArt'].map(id=>doc.getElementById(id));
   Promise.all(images.map(im=>im.decode())).then(()=>{
    win.OpticsPosterArt?.renderImmediately({
     dist:doc.getElementById('optEyeDist').value,
     height:doc.getElementById('optCheekHeight').value
    });
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
     win.scrollTo(0,0);document.body.dataset.snapshot='ready';
    }));
   }).catch(()=>{document.body.dataset.snapshot='error';document.body.dataset.reason='optics image decode failed'});
  } else requestAnimationFrame(()=>{win.scrollTo(0,0);document.body.dataset.snapshot='ready'});
 } catch(e){document.body.dataset.snapshot='error';document.body.dataset.reason=e.message}
},{once:true});
</script></body></html>
