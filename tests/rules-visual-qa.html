<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%}</style></head>
<body><iframe id="page" title="Rules PDF QA"></iframe>
<script>
 const name=new URLSearchParams(location.search).get('doc')==='minutes'?'minutes':'rules';
 const frame=document.getElementById('page');
 frame.src='/rules.html?doc='+name;
 frame.addEventListener('load',()=>{
  const timer=setInterval(()=>{
   const d=frame.contentDocument;
   if(!d?.documentElement.dataset.pdfRendered?.startsWith(name+':'))return;
   clearInterval(timer);
   d.querySelector('.rules-reading').scrollIntoView({block:'start'});
   requestAnimationFrame(()=>requestAnimationFrame(()=>{document.body.dataset.snapshot='ready';}));
  },80);
 });
</script></body>
</html>
