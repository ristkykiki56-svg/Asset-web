name: Temporary Optik equipment foreground generator

on:
  push:
    branches: [fix/lab-optics-mask-and-neck-20261021]
permissions:
  contents: write
jobs:
  build-static-foreground:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install image dependencies
        run: python3 -m pip install --user Pillow==11.3.0 numpy==2.3.3
      - name: Build translucent stationary hardware overlay
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageFilter
          import numpy as np,hashlib
          from pathlib import Path
          
          root=Path('assets/optics')
          src=root/'optic-static.webp'
          before=hashlib.sha256(src.read_bytes()).hexdigest()
          rgb=Image.open(src).convert('RGB')
          arr=np.asarray(rgb).astype('float32')
          h,w=arr.shape[:2]
          if (w,h)!=(1320,528):raise SystemExit('Unexpected static asset dimensions')
          yy,xx=np.mgrid[0:h,0:w]
          lum=.22*arr[:,:,0]+.70*arr[:,:,1]+.08*arr[:,:,2]
          # Extract physical fixed hardware and clothing, never repaint the human face.
          # The rest of the image remains transparent, allowing the moving head through.
          region=((xx<840)&(yy<309))|((xx>=580)&(yy>=280))
          alpha=np.clip((235-lum)/29,0,1)*region
          mask=Image.fromarray(np.uint8(np.round(alpha*255)),'L').filter(ImageFilter.GaussianBlur(.65))
          front=rgb.convert('RGBA')
          front.putalpha(mask)
          out=root/'optic-foreground.webp'
          front.save(out,'WEBP',quality=96,method=6,exact=True)
          check=Image.open(out).convert('RGBA')
          if check.size!=(1320,528):raise SystemExit('Foreground dimensions invalid')
          if hashlib.sha256(src.read_bytes()).hexdigest()!=before:raise SystemExit('Static WebP unexpectedly changed')
          if np.asarray(check)[:,:,3].max()<200:raise SystemExit('Missing foreground opacity')
          print('Fixed rifle/optical foreground built',out.stat().st_size,'bytes; background untouched')
          PY
      - name: Commit generated WebP to repair branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/optics/optic-foreground.webp
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix(optics): isolate fixed rifle and scope foreground as WebP'
          git push origin HEAD:fix/lab-optics-mask-and-neck-20261021
