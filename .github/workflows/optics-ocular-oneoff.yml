name: Temporary ocular rim asset repair

on:
  push:
    branches:
      - fix/optic-ocular-rim-lock-20261021

permissions:
  contents: write

jobs:
  build-scope-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install deterministic WebP dependency
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Transfer missing rim pixels from head to fixed foreground
        run: python3 scripts/fix-optics-ocular-rim.py
      - name: Commit only the two modified WebP assets
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/optics/optic-head.webp assets/optics/optic-foreground.webp
          git diff --cached --quiet && { echo 'Expected WebP change missing'; exit 1; }
          git commit -m 'fix(optics): lock complete ocular rim to stationary foreground'
          git push origin HEAD:fix/optic-ocular-rim-lock-20261021
