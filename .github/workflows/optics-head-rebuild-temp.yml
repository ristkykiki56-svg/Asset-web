name: Temporary original-head reconstruction

on:
  push:
    branches: [fix/lab-optics-mask-and-neck-20261021]
permissions:
  contents: write
jobs:
  reconstruct-head-from-original:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install original-artwork decoding libraries
        run: python3 -m pip install --user Pillow==11.3.0 numpy==2.3.3
      - name: Recover authentic head silhouette from registered plates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageFilter
          import numpy as np
          root=Path("assets/optics")
          bg=Image.open(root/"optic-static.webp").convert("RGB")
          original=Image.open(root/"optic-artwork.webp").convert("RGB")
          s=np.asarray(bg).astype(float)
          o=np.asarray(original).astype(float)
          if s.shape!=(528,1320,3) or o.shape!=s.shape:
              raise SystemExit("Unexpected source image geometry")
          yy,xx=np.mgrid[0:528,0:1320]
          diff=np.abs(o-s).max(axis=2)
          # Recover the actual original jaw, hair, face and neck pixels. The old sprite
          # had mistakenly dropped 1000+ true neck/jaw pixels at its rectangular edge.
          opacity=np.clip((diff-7)/28,0,1)*((xx>=745)&(yy<=435))
          opacity=np.asarray(Image.fromarray(np.uint8(opacity*255),'L').filter(ImageFilter.GaussianBlur(.55))).astype(float)/255
          opacity=np.where(opacity<.035,0,opacity)
          # Unmatte against the precise static plate, preserving true source color.
          layer_rgb=np.clip((o-(1-opacity[:,:,None])*s)/np.maximum(opacity,.08)[:,:,None],0,255)
          head=Image.fromarray(np.dstack([layer_rgb,np.rint(opacity*255)]).astype('uint8'),'RGBA')
          head.save(root/'optic-head.webp','WEBP',quality=92,method=6,exact=True)
          rendered=Image.alpha_composite(bg.convert('RGBA'),Image.open(root/'optic-head.webp').convert('RGBA'))
          region=(xx>760)&(yy<430)
          mean_error=np.abs(np.asarray(rendered.convert('RGB')).astype(float)-o)[region].mean()
          if mean_error>4:raise SystemExit('Reconstructed neutral composite differs from original, mean='+str(mean_error))
          if not (Image.open(root/'optic-head.webp').mode=='RGBA'):raise SystemExit("Alpha dropped")
          print("Restored source-accurate head, neck and jaw; neutral mean error",round(mean_error,3))
          PY
      - name: Commit reconstructed WebP to feature branch only
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/optics/optic-head.webp
          git diff --cached --quiet && exit 1 || true
          git commit -m 'fix(optics): restore original jaw and neck silhouette in moving WebP'
          git push origin HEAD:fix/lab-optics-mask-and-neck-20261021
