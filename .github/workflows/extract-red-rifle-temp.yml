name: Temporary poster rifle WebP extraction

on:
  push:
    branches: [feat/hardware-red-poster-raster-20261021]

permissions:
  contents: write

jobs:
  extract-red-rifle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Get supplied source poster
        run: |
          curl -fL --retry 3 --connect-timeout 15 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3K4pbhySSAk6qPsInxf3UjkMmzd/99742e69-c4b4-4661-bb1f-d59370666a29.png' \
            -o /tmp/twinshooter-original-poster.png
          echo '539b42a3e18a07f6d9acaa44864d401aafe1795ee3d12fd7774f174d91652cd7  /tmp/twinshooter-original-poster.png' | sha256sum --check
      - name: Install extraction libraries
        run: python3 -m pip install --user Pillow==11.3.0 numpy==2.3.3 opencv-python-headless==4.12.0.88
      - name: Extract original red rifle into transparent WebP
        run: python3 scripts/extract-red-rifle-poster.py --poster /tmp/twinshooter-original-poster.png --output assets/hardware/aurellia-red-poster.webp
      - name: Commit generated WebP to feature branch only
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/hardware/aurellia-red-poster.webp
          git diff --cached --quiet && { echo 'No image generated'; exit 1; }
          git commit -m 'feat(hardware): add poster-extracted red rifle WebP'
          git push origin HEAD:feat/hardware-red-poster-raster-20261021
