name: Twin Shooter static smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  motion-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node smoke tests
        run: node --test tests/motion-smoke.test.mjs
