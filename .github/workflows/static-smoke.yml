name: Twin Shooter static smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  motion-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node smoke tests
        run: node --test tests/*.test.mjs
      - name: Check real-browser viewport behavior
        run: bash tests/browser-smoke.sh
      - name: Upload website QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinshooter-pages-qa
          path: |
            /tmp/twinshooter-qa/desktop.png
            /tmp/twinshooter-qa/mobile.png
            /tmp/twinshooter-qa/viewport-result.html
            /tmp/twinshooter-qa/lab-desktop.png
            /tmp/twinshooter-qa/lab-mobile.png
            /tmp/twinshooter-qa/lab-hardware-desktop.png
            /tmp/twinshooter-qa/lab-hardware-mobile.png
            /tmp/twinshooter-qa/lab-posture-desktop.png
            /tmp/twinshooter-qa/lab-posture-mobile.png
            /tmp/twinshooter-qa/lab-anatomy-front-desktop.png
            /tmp/twinshooter-qa/lab-anatomy-front-mobile.png
            /tmp/twinshooter-qa/lab-trigger-desktop.png
            /tmp/twinshooter-qa/lab-trigger-mobile.png
            /tmp/twinshooter-qa/lab-optics-desktop.png
            /tmp/twinshooter-qa/lab-optics-mobile.png
            /tmp/twinshooter-qa/lab-optics-detail-neutral.png
            /tmp/twinshooter-qa/lab-optics-detail-close.png
            /tmp/twinshooter-qa/lab-optics-detail-far.png
            assets/optics/optic-head.webp
            assets/optics/optic-static.webp
            assets/optics/optic-foreground.webp
            assets/optics/optic-artwork.webp
            /tmp/twinshooter-qa/lab-silhouette-desktop.png
            /tmp/twinshooter-qa/lab-silhouette-mobile.png
            /tmp/twinshooter-qa/lab-viewport-result.html
            /tmp/twinshooter-qa/posture-blue-front-desktop.png
            /tmp/twinshooter-qa/posture-blue-front-mobile.png
            /tmp/twinshooter-qa/posture-blue-sideLeft-desktop.png
            /tmp/twinshooter-qa/posture-blue-sideLeft-mobile.png
            /tmp/twinshooter-qa/posture-blue-back-desktop.png
            /tmp/twinshooter-qa/posture-blue-back-mobile.png
            /tmp/twinshooter-qa/posture-red-front-desktop.png
            /tmp/twinshooter-qa/posture-red-front-mobile.png
            /tmp/twinshooter-qa/posture-red-sideLeft-desktop.png
            /tmp/twinshooter-qa/posture-red-sideLeft-mobile.png
            /tmp/twinshooter-qa/posture-red-back-desktop.png
            /tmp/twinshooter-qa/posture-red-back-mobile.png
            /tmp/twinshooter-qa/posture-sprite-result.html
          if-no-files-found: ignore
