name: Twin Shooter static smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  motion-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node smoke tests
        run: node --test tests/*.test.mjs
      - name: Check real-browser viewport behavior
        run: bash tests/browser-smoke.sh
      - name: Upload homepage QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twinshooter-homepage-qa
          path: |
            /tmp/twinshooter-qa/desktop.png
            /tmp/twinshooter-qa/mobile.png
            /tmp/twinshooter-qa/viewport-result.html
          if-no-files-found: ignore
