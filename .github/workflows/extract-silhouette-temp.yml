name: Temporary poster silhouette WebP extraction

on:
  push:
    branches: [feat/silhouette-poster-webp-20261021]
permissions:
  contents: write
jobs:
  extract-poster-targets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download reference poster and verify exact bytes
        run: |
          curl -fL --retry 3 --connect-timeout 15 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3K4pbhySSAk6qPsInxf3UjkMmzd/99742e69-c4b4-4661-bb1f-d59370666a29.png' \
            -o /tmp/twinshooter-poster.png
          echo '539b42a3e18a07f6d9acaa44864d401aafe1795ee3d12fd7774f174d91652cd7  /tmp/twinshooter-poster.png' | sha256sum --check
      - name: Install raster dependencies
        run: python3 -m pip install --user Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Extract four original silhouettes to transparent WebP
        run: python3 scripts/extract-poster-silhouettes.py --poster /tmp/twinshooter-poster.png --output assets/silhouettes
      - name: Commit only four WebP assets to feature branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/silhouettes/chicken.webp assets/silhouettes/pig.webp assets/silhouettes/turkey.webp assets/silhouettes/ram.webp
          git diff --cached --quiet && { echo 'Expected target assets not produced'; exit 1; }
          git commit -m 'feat(silhouette): add four authentic poster-derived WebP targets'
          git fetch origin feat/silhouette-poster-webp-20261021
          git rebase origin/feat/silhouette-poster-webp-20261021
          git push origin HEAD:feat/silhouette-poster-webp-20261021
