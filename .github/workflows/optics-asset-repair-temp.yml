name: Temporary optics asset repair

on:
  push:
    branches: [fix/lab-optics-mask-and-neck-20261021]

permissions:
  contents: write

jobs:
  repair-artwork:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install Pillow and NumPy
        run: python3 -m pip install --user Pillow==11.3.0 numpy==2.3.3
      - name: Recut head alpha preserving original visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import numpy as np
          import hashlib
          
          root = Path("assets/optics")
          base_path = root / "optic-static.webp"
          head_path = root / "optic-head.webp"
          base_hash = hashlib.sha256(base_path.read_bytes()).hexdigest()
          static = np.asarray(Image.open(base_path).convert("RGB")).astype(np.float32)
          head = Image.open(head_path).convert("RGBA")
          rgba = np.asarray(head).copy()
          alpha = rgba[:, :, 3].astype(np.float32)
          height, width = alpha.shape
          if (width, height) != (1320, 528): raise SystemExit("Unexpected dimensions")
          yy, xx = np.mgrid[0:height, 0:width]
          # Eliminate accidental ocular pixels from the leading edge of the moving
          # sprite while preserving the hair/face with a narrow soft transition.
          alpha *= np.clip((xx - 816) / 22.0, 0, 1)
          # Fixed rail/mount surfaces take precedence over the moving cutout.
          luma = static[:,:,0]*.22 + static[:,:,1]*.70 + static[:,:,2]*.08
          metal = (luma < 142) & (np.max(static,axis=2) < 195)
          foreground = metal & (xx >= 810) & (xx < 1050) & (yy >= 300) & (yy < 395)
          protected = np.asarray(Image.fromarray((foreground.astype("uint8")*255), "L").filter(ImageFilter.MaxFilter(3))).astype(np.float32)/255
          alpha *= (1-protected)
          # Feather the lower neck/collar cut line. Do not blur the eye or scope.
          eligible = (xx >= 865) & (xx <= 1110) & (yy > 295)
          last = np.where(np.max(alpha,axis=0) > 20,np.argmax((alpha>20)[::-1],axis=0),height)
          last = height-1-last
          feather = np.clip((last[np.newaxis,:]-yy)/12.0,0,1)
          alpha = np.where(eligible,alpha*feather,alpha)
          rgba[:,:,3] = np.clip(np.rint(alpha),0,255).astype("uint8")
          out = Image.fromarray(rgba,"RGBA")
          out.save(head_path, "WEBP", quality=96, method=6, exact=True)
          if hashlib.sha256(base_path.read_bytes()).hexdigest() != base_hash:
              raise SystemExit("Static rifle/scope changed unexpectedly")
          if (np.asarray(out)[:,:816,3]>16).any():
              raise SystemExit("Moving head still contains ocular-front pixels")
          if out.getbbox() is None: raise SystemExit("Empty head cutout")
          print("Head alpha mask repaired; scope/rifle asset SHA unchanged")
          PY
      - name: Commit repaired WebP only to feature branch
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/optics/optic-head.webp
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix(optics): remove scope fragments and feather neck cutout'
          git push origin HEAD:fix/lab-optics-mask-and-neck-20261021
